# Pinned settings for the kit. Scripts read this file. Change a value here,
# not inside a script.

# Warmbly release to install. v0.8.3 is the release this setup was proven on
# (10 mailboxes connected and warming). v0.8.4 came out 2026-11-12 and is not
# yet tested with this kit; move up later with scripts/upgrade-warmbly.sh.
WARMBLY_VERSION=v0.8.3

# sha256 of Warmbly's install.sh at that release tag
# (site/public/install.sh in the warmbly/warmbly repo). The same file is served
# at https://warmbly.com/install.sh. If you change WARMBLY_VERSION, update this
# from https://raw.githubusercontent.com/warmbly/warmbly/<tag>/site/public/install.sh.sha256
WARMBLY_INSTALLER_SHA256=55f94f703aa944de26eeddaf25c89df73420ca5b95ac85505e89432a6d334d54

# Hetzner server. CX33 = 4 vCPU, 8 GB memory, 80 GB disk.
HETZNER_SERVER_TYPE=cx33
HETZNER_IMAGE=ubuntu-24.04
# First choice, then fallbacks if Hetzner has no CX33 free there.
HETZNER_LOCATIONS="fsn1 nbg1 hel1"
HETZNER_SERVER_NAME=warmbly
HETZNER_FIREWALL_NAME=warmbly-fw
HETZNER_SSH_KEY_NAME=warmbly-kit

# Mac side
SSH_HOST_ALIAS=warmbly
SSH_KEY_PATH="$HOME/.ssh/warmbly_ed25519"
KIT_DIR="$HOME/.config/warmbly-kit"

# Server side
WARMBLY_DIR=/opt/warmbly

# The subdomain label Warmbly lives under. With domain example.com the
# dashboard is https://app.warmbly.example.com
APP_LABEL=warmbly
